name = "olagoon-admin"
main = "index.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "olagoon.com/api/admin/*", zone_name = "olagoon.com" },
  { pattern = "olagoon.com/api/auth/*", zone_name = "olagoon.com" },
]

[vars]
ADMIN_USERNAME = "admin"
GITHUB_OWNER = "olagoon"
GITHUB_REPO = "official"
