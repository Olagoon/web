name = "olagoon-automation"
main = "src/index.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "olagoon.com/api/automation/*", zone_name = "olagoon.com" },
]

# Cron trigger (0 2 * * *) is set via REST API by .github/workflows/deploy.yml
# ("Set automation cron schedule" step). Keeping it out of [triggers] avoids
# wrangler failing the whole deploy when the schedules endpoint errors.

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "olagoon-data"
