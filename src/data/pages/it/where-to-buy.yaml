meta:
  title: Dove acquistare tavole paddle gonfiabili OLagoon | OLagoon
  description: Scopri come acquistare una tavola paddle gonfiabile OLagoon — tramite un distributore ufficiale nel tuo paese o direttamente dal team OLagoon.
hero:
  tagline: Dove acquistare
  title: Porta il tuo SUP OLagoon in acqua
  subtitle: Le tavole OLagoon raggiungono paddler in oltre 50 paesi. Trova il modo più semplice per avere la tua — tramite un distributore ufficiale vicino a te o direttamente dal team OLagoon.
channels:
  items:
    - title: Distributori ufficiali per paese
      description: OLagoon collabora con distributori esclusivi in molti paesi. Dicci dove pagai e ti metteremo in contatto con il tuo rivenditore locale, prezzi e disponibilità.
      cta: Trova il tuo rivenditore locale
      href: /contact/?subject=Where to Buy
    - title: Ordine diretto da OLagoon
      description: Ancora nessun distributore nel tuo paese? Il team OLagoon può organizzare ordini diretti e spedizioni per farti godere l'acqua ovunque tu viva.
      cta: Richiedi disponibilità
      href: /contact/?subject=Where to Buy
form_intro:
  title: Chiedi la disponibilità
  subtitle: Inviaci un messaggio con il tuo paese e la tavola che ti interessa. Il nostro team risponderà entro un giorno lavorativo con il rivenditore più vicino o le opzioni di ordine diretto.
business_note:
  text: Acquisti per un club, un resort o un negozio? Scopri i nostri programmi business e di partnership.
  cta: Per i partner commerciali
  href: /solutions/
