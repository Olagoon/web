meta:
  title: 'Pool Rental Equipment Supplier & Fleet Solutions | {SITE}'
  description: 'Pool rental equipment supplier for party and event rental operators. High-rotation commercial drop-stitch pools engineered for repeated rentals — UV-resistant PVC, reinforced seams, quick-dry surfaces. Scale your rental business with OLagoon.'

hero:
  tagline: Rental Operators
  title: 'Scale Your Rental Business<br />With Confidence'
  subtitle: 'Pool rental equipment supplier for party and event rental operators. High-rotation pools engineered for weekend-after-weekend rentals, all season long. Your calendar never sits idle.'
  image:
    src: https://assets.olagoon.com/images/olagoon/lifestyle/olagoon-lifestyle-1.webp
    alt: Rental fleet of OLagoon pools ready for weekend bookings

features:
  title: Built for the Rental Grind
  subtitle: 'Every pool is engineered for 500+ rental cycles with minimal maintenance.'
  items:
    - title: '500+ Rental Cycles'
      description: 'Valves and seams cycle-tested beyond 500 setups, takedowns, and re-rolls.'
      icon: 'tabler:shield-check'
    - title: 'UV-Resistant Fabric'
      description: 'No fading or degradation after a full season of outdoor use.'
      icon: 'tabler:sun'
    - title: 'Drop-Stitch 2.0 Core'
      description: '16,000 threads/m² — rigid walls rated to 18 PSI, far tougher than generic inflatables.'
      icon: 'tabler:layers-intersect'
    - title: 'Quick-Dry Surfaces'
      description: 'Pools wiped down and re-rolled for the next booking in under 30 minutes.'
      icon: 'tabler:droplet'
    - title: 'Compact Storage'
      description: 'Pools fold into storage bags — a full rental fleet fits in one cargo van.'
      icon: 'tabler:stack'
    - title: 'Color-Coded Sizes'
      description: 'Staff grabs the right pool instantly with color-coded sizing.'
      icon: 'tabler:color-swatch'

stats:
  title: Operations Metrics
  stats:
    - title: Pool Setup
      amount: '< 30 min'
    - title: Daily Care
      amount: '~15 min'
    - title: Parts Dispatch
      amount: '48h'
    - title: Defect Rate
      amount: '< 0.5%'

fleet_guide:
  title: Fleet Sizing Guide
  subtitle: 'Estimate the fleet size and revenue potential for your rental operation.'
  tiers:
    - label: Starter Fleet
      pools: '2-3'
      revenue: '$25K-$45K/yr'
    - label: Growing Operation
      pools: '4-6'
      revenue: '$45K-$90K/yr'
    - label: Multi-Crew Operation
      pools: '8-12'
      revenue: '$90K-$150K/yr'

cta:
  title: 'Ready to scale your rental business?'
  subtitle: 'Get rental pricing or compare pool models for your operation.'
  actions:
    - text: 'Get Rental Pricing'
      href: '/contact/?package=rental'
      variant: 'primary'
    - text: 'Compare Pool Models'
      href: '/compare/'
      variant: 'secondary'
