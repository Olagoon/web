meta:
  title: Waar koop je opblaasbare paddleboards van OLagoon | OLagoon
  description: Ontdek hoe je een opblaasbaar paddleboard van OLagoon koopt — via een officiële distributeur in jouw land of rechtstreeks van het OLagoon-team.
hero:
  tagline: Waar te kopen
  title: Breng je OLagoon SUP op het water
  subtitle: OLagoon-boards bereiken paddelaars in meer dan 50 landen. Vind de eenvoudigste manier om de jouwe te krijgen — via een officiële distributeur bij jou in de buurt of rechtstreeks van het OLagoon-team.
channels:
  items:
    - title: Officiële landendistributeurs
      description: OLagoon werkt met exclusieve distributeurs in veel landen. Vertel ons waar je paddelt en wij verbinden je met je lokale dealer, prijzen en beschikbaarheid.
      cta: Vind je lokale dealer
      href: /contact/?subject=Where to Buy
    - title: ' Rechtstreeks bij OLagoon bestellen'
      description: Nog geen distributeur in jouw land? Het OLagoon-team kan directe bestellingen en verzending regelen zodat je het water op kunt, waar je ook woont.
      cta: Beschikbaarheid opvragen
      href: /contact/?subject=Where to Buy
form_intro:
  title: Vraag naar beschikbaarheid
  subtitle: Stuur ons een bericht met jouw land en het board waarin je geïnteresseerd bent. Ons team antwoordt binnen één werkdag met je dichtstbijzijnde dealer of opties voor directe bestelling.
business_note:
  text: Koop je voor een club, resort of winkel? Ontdek onze zakelijke- en partnerschapsprogramma's.
  cta: Voor zakelijke partners
  href: /solutions/
