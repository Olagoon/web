faqs:
  title: Backyard Pool FAQs
  subtitle: Common questions from OLagoon owners about setup, care, and storage.
  items:
    - q: How long does setup take?
      a: >-
        About 15 minutes to inflate with the electric pump, then 1–3 hours to fill depending on
        your water pressure. No tools, no professional installation — unroll, inflate, connect
        the filter, and fill with a garden hose.
    - q: How rigid are the walls really?
      a: >-
        OLagoon pools run at 10–15 PSI — the same pressure class as inflatable yacht tenders.
        Thousands of drop-stitch threads lock the wall layers together, so the 20 cm walls stay
        ruler-straight and adults can sit on the edge.
    - q: What does maintenance involve?
      a: >-
        The sand-filter pump circulates and cleans the water; backwash it about once a week with
        the 6-way valve. Keep the thermal cover on between swims to keep debris out. The filter
        sand lasts about 5 seasons — no cartridge refills.
    - q: Can I leave it up all summer?
      a: >-
        Yes. The UV-resistant PVC fabric is rated for full-season exposure. Use the included
        ground mat on any surface, keep filtration running, and cover the pool overnight to
        retain warmth and keep it clean.
    - q: What surface can it go on?
      a: >-
        Any firm, level surface — lawn, pavers, or a concrete pad. Remove stones and sharp
        objects first and lay the protective ground mat underneath. Filled pools are heavy, so
        confirm decks are rated for a similar water volume.
    - q: What happens in winter?
      a: >-
        Drain, deflate, and fold the pool into its storage bag for indoor storage. That is the
        point of drop-stitch: a full-size pool that packs into a box and comes back next summer.
