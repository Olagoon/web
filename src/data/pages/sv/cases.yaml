features3_cases:
  tagline: Featured Cases
  title: 'Custom Solutions<br />For Real Challenges'
  isBeforeContent: false
  columns: 3
  items:
    - title: Caribbean Resort Pool Program
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Hospitality & Resort Operations
      challenge: 'Luxury resort wanted to add guest swimming capacity without a construction project. Needed 12 pools across three properties, custom resort branding, matched filtration, and delivery before peak season — all within 60 days.'
      solution: 'Produced 12 Family Oasis pools with custom resort graphics, 8 sand filter pumps, thermal covers, and entry steps. Each pool was pressure-tested and branded with the customer livery. All units shipped from Qingdao within 55 days.'
      product: Family Oasis Resort Package
      results: 'All 12 pools delivered on time for peak season. Pools have been in daily operation for 18+ months with zero material failures. The resort ordered 6 additional units in year two.'
      image: 'https://assets.olagoon.com/images/olagoon/products/family-oasis.webp'
      quote: 'The Family Oasis pools became our most requested guest amenity. Setup took minutes, water care is simple, and the resort branding looks fantastic.'
      icon: tabler:beach
    - title: Australian Distributor Private-Label Program
      customer: Pacific Leisure Pty Ltd
      country: Australia
      industry: Private Label & Distribution
      challenge: 'Australian distributor needed a private-label pool range at competitive pricing to compete with direct-to-consumer imports. Required models covering plunge, family, and lounge segments, with custom graphics, retail packaging, and drop-ship fulfillment.'
      solution: 'Developed a 3-model private-label line (2 m plunge, 3 m family, 5 m lounge) with exclusive Australian graphics package. Custom retail packaging with QR codes linking to setup videos. Drop-ship logistics configured from Qingdao direct to Australian retail stores.'
      product: Custom Pool Line (3 models)
      results: 'Concept to first shipment in 90 days. Retail sell-through rate of 85% in first season. Distributor expanded the partnership with accessory SKUs in year two.'
      image: 'https://assets.olagoon.com/images/olagoon/products/grand-lagoon.webp'
      quote: 'OLagoon delivered a complete pool line in 90 days — from initial design to retail floor. The quality matches brands selling at twice the price point.'
      icon: tabler:currency-dollar
    - title: US Community Pool Program
      customer: Riverside Parks & Recreation
      country: United States
      industry: Municipal & Community Programs
      challenge: 'City parks department needed seasonal swimming capacity for three neighborhood parks without permanent pool construction budgets. Required durable pools, easy staff setup, and ADA-considerate entry options for public programs.'
      solution: 'Supplied 6 Grand Lagoon pools with sand filter pumps, ground mats, entry steps, and thermal covers. High-visibility safety graphics, reinforced construction, and staff training materials were included with each unit.'
      product: Grand Lagoon Community Package
      results: 'Pools deployed across 3 parks for two seasons. Operating in sustained heat and heavy public use with no degradation. Summer program attendance doubled.'
      image: 'https://assets.olagoon.com/images/olagoon/products/grand-lagoon.webp'
      quote: 'The Grand Lagoon pools survived two summers of daily public use with only routine water care. Our staff can set one up in under 30 minutes.'
      icon: tabler:building-community
    - title: European White-Label Partnership
      customer: NordPool Equipment BV
      country: Netherlands
      industry: White Label & Brand Licensing
      challenge: 'Established European outdoor brand wanted to enter the backyard pool market without investing in manufacturing. Needed a white-label partner capable of producing a 3-model pool line with private branding, CE documentation, and exclusive EU distribution rights.'
      solution: 'Established white-label manufacturing agreement for a 3-model line. Each model branded with customer logos and color scheme. CE certification documentation prepared per model. Exclusive EU distribution rights granted with minimum order commitments.'
      product: Custom Pool Line (3 models)
      results: 'Multi-year agreement signed. First production run of 50 units shipped within 75 days. Brand launched at a major trade show with positive dealer reception.'
      image: 'https://assets.olagoon.com/images/olagoon/products/family-oasis.webp'
      quote: 'Working with OLagoon allowed us to enter the pool market without building a factory — they delivered a complete turnkey solution with CE documentation and dealer support.'
      icon: tabler:building
    - title: Holiday Park Rental Fleet
      customer: SunnyFields Holiday Parks
      country: France
      industry: Tourism & Rental Operations
      challenge: 'Chain of 5 holiday parks wanted to offer pool rentals to guests at campsites without permanent infrastructure. Needed a durable fleet with fast turnover, simple water care, and compact off-season storage.'
      solution: 'Produced a 15-pool fleet of Compact Plunge and Family Oasis models with matched filtration, quick-drain valve configurations, and shared spare-parts kits. Staff training covered setup, water care, and turnover procedures.'
      product: Rental Fleet (15 units)
      results: 'Fleet launched across 5 parks in spring. Rental utilization reached 70% in the first season. Pools stack in a storage room over winter with zero winterization cost.'
      image: 'https://assets.olagoon.com/images/olagoon/products/compact-plunge.webp'
      quote: 'The complete package approach meant we received everything we needed in one shipment — pools, filters, and spares, all branded and ready for guests.'
      icon: tabler:sun
    - title: US Retail Chain Rollout
      customer: GreatOutdoors Retail Co.
      country: United States
      industry: Retail & Distribution
      challenge: 'National outdoor retailer wanted a premium inflatable pool program for the spring season across 40 stores. Required reliable supply of 800 units, retail-ready packaging, in-store display materials, and a warranty support process.'
      solution: 'Built a 3-SKU retail program (Compact Plunge, Family Oasis, sand filter pump) with shelf-ready packaging, planogram displays, and a dedicated warranty line. Production scheduled across two runs with QA sampling at each stage. 800 units delivered to regional DCs in phases.'
      product: Retail Pool Program (800 units)
      results: 'Program sold through 92% by mid-summer. Warranty claims below 0.5%. Retailer renewed the program for the following season with expanded accessory SKUs.'
      image: 'https://assets.olagoon.com/images/olagoon/products/sand-filter-pump.webp'
      quote: 'OLagoon gave us a turnkey seasonal program — the pools sold through fast, and their warranty handling kept our customer service team out of trouble.'
      icon: tabler:shield
