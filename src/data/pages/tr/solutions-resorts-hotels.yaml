meta:
  title: 'Resort & Hotel Pool Supplier | Resort Pool Programs | {SITE}'
  description: 'Resort pool supplier for hotels and resorts worldwide. Commercial-grade drop-stitch pool packages, custom branding, staff training, and guest-ready installation in a single day.'

hero:
  tagline: Resorts & Hotels
  title: 'Turn Your Lawn Into a Guest Magnet<br />With Premium Pool Programs'
  subtitle: 'OLagoon equips resorts worldwide with commercial-grade drop-stitch pools — from 2-pool boutique packages to 6+ pool flagship programs. Custom branding, staff training, and replacement parts included.'
  image:
    src: https://assets.olagoon.com/images/olagoon/lifestyle/olagoon-lifestyle-1.webp
    alt: Resort guests enjoying a drop-stitch pool on the lawn

roi_section:
  title: 'The Resort Pool Amenity Model'
  subtitle: 'How resorts add guest-ready pool experiences in a single season — without permanent construction.'
  metrics:
    - metric: '1 Day'
      label: Installation Time
      detail: A complete pool zone set up in a day — no permits, no construction
    - metric: '90% Less'
      label: vs In-Ground Construction
      detail: Typical investment compared with a permanent pool build
    - metric: '20 cm'
      label: Sit-On Walls
      detail: Shallow, supervision-friendly water depth for families
    - metric: '48h'
      label: Parts Dispatch
      detail: Replacement parts shipped worldwide within 48 hours

packages:
  title: Resort Package System
  subtitle: 'Choose the package that fits your guest capacity and season length. All packages include a 2-year warranty and CE certification.'
  items:
    - name: Starter Package
      tagline: 'For boutique resorts and cabin parks'
      features:
        - '2 pools (Family Oasis 3 m × 2 m)'
        - '2 sand-filter pump systems'
        - 'Thermal covers + ground mats'
        - 'Entry steps for easy access'
        - 'Custom logo print on every pool'
        - '2-year warranty + CE certified'
      revenue: 'Complete program from $30K–$45K per season'
      cta_text: 'Get Starter Package'
    - name: Premium Package
      tagline: 'For family resorts, 50-100 guests/day'
      features:
        - '4 pools (Family Oasis + Grand Lagoon flagship)'
        - '4 sand-filter pump systems'
        - 'Complete accessory sets (covers, mats, steps)'
        - 'Full custom branding on every pool'
        - 'Staff training session (online)'
        - '48-hour replacement parts dispatch'
        - '2-year warranty + CE certified'
      revenue: 'Complete program from $45K–$70K per season'
      popular: true
      cta_text: 'Get Premium Package'
    - name: Flagship Package
      tagline: 'For large resorts & resort groups'
      features:
        - '6+ pools including the Grand Lagoon flagship'
        - 'Complete accessory sets (pumps, covers, mats, steps)'
        - 'On-site staff training (2 days)'
        - 'Dedicated account manager'
        - 'Priority replacement parts (24h dispatch)'
        - 'Full custom branding across the fleet'
        - 'Marketing photo & video package'
        - '2-year warranty + CE certified'
      revenue: 'Custom programs from $70K per season'
      cta_text: 'Get Flagship Package'

case_study:
  quote: 'Two pools, one morning of setup, zero construction permits. By the first weekend our lawn had become the most photographed spot at the resort.'
  author: 'General Manager'
  location: 'Lakeside family resort, Minnesota, USA'
  results:
    - label: 'Setup Time'
      value: '1 Morning'
    - label: 'Investment vs In-Ground'
      value: '-90%'
    - label: 'Warranty'
      value: '2 Years'

features:
  title: Why Resorts Choose OLagoon
  subtitle: 'Commercial-grade durability, global logistics, and a partner who understands hospitality.'
  items:
    - title: '500+ Rental Cycles'
      description: 'Every pool is cycle-tested to survive season after season of daily guest use.'
      icon: 'tabler:shield-check'
    - title: '48h Parts Dispatch'
      description: 'Replacement parts shipped within 48 hours — your guest experience never waits.'
      icon: 'tabler:truck-delivery'
    - title: 'Custom Branding'
      description: 'Match your resort identity with custom colors and logo on every pool.'
      icon: 'tabler:palette'
    - title: 'Staff Training'
      description: 'Online and on-site training on setup, water care, and supervision for your activities team.'
      icon: 'tabler:school'
    - title: 'Global Logistics'
      description: 'Shipping to 50+ countries with consolidated freight options.'
      icon: 'tabler:world'
    - title: 'CE Certified'
      description: 'Every pool CE-marked, REACH-compliant, and built in an ISO 9001:2015 factory.'
      icon: 'tabler:certificate'

cta:
  title: 'Ready to turn your lawn into a guest magnet?'
  subtitle: 'Get your resort package quote or download our complete resort catalog.'
  actions:
    - text: 'Get Resort Package'
      href: '/contact/?package=resort'
      variant: 'primary'
    - text: 'Download Resort Catalog'
      href: '/resources/download-catalog/'
      variant: 'secondary'
