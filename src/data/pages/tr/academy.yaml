    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Cleaning & Care
        desc: Surface cleaning, UV protection, seam inspection, and proper drying before every storage.
        slug: pool-setup-guide
      - title: Winter Storage
        desc: Drain, clean, dry, fold — best practices for storing your pool through the off-season.
        slug: pool-winter-storage
      - title: Repairs & Patches
        desc: Fix small punctures and seam issues with the included PVC repair kit — step by step.
        slug: pool-setup-guide

