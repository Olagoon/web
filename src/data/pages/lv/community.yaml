stories:
  tagline: 'Owner Stories'
  title: 'Real backyards from real people'
  subtitle: 'Hear from families, swimmers, and operators who use OLagoon pools every summer.'
  items:
    - name: 'Sarah & Mike'
      title: 'Family Oasis owners, Canada'
      content: 'We set up our Family Oasis at the lake cabin for a week. The kids swam every single day. The drop-stitch construction meant the 20 cm walls stayed rock-solid at full fill — a real pool experience from a box that fits in the trunk.'
      image: 'https://assets.olagoon.com/images/olagoon/products/family-oasis.webp'
      location: 'Algonquin Park, Canada'
    - name: 'Carlos R.'
      title: 'Family Oasis owner, Spain'
      content: 'The Family Oasis is our go-to for hot summers. The integrated seating is perfect for relaxing while the kids play, and the included sand-filter pump keeps the water crystal clear with barely any maintenance.'
      image: 'https://assets.olagoon.com/images/olagoon/products/family-oasis.webp'
      location: 'Costa Brava, Spain'
    - name: 'Lina & family'
      title: 'Compact Plunge owners, Sweden'
      content: 'Weekend fun in our small garden. The Compact Plunge fits our terrace perfectly and still fits the whole family for a cool-down. Sets up in about 30 minutes — no construction needed, just pure family fun all summer.'
      image: 'https://assets.olagoon.com/images/olagoon/products/compact-plunge.webp'
      location: 'Stockholm, Sweden'
    - name: 'Marco & Ana'
      title: 'Grand Lagoon owners, Philippines'
      content: 'We use our Grand Lagoon for daily swimming and weekend gatherings. After months of daily use in tropical conditions, the pool still performs like new. The 5 m length is enough for real laps — that would be impossible with lesser pools.'
      image: 'https://assets.olagoon.com/images/olagoon/products/grand-lagoon.webp'
      location: 'Palawan, Philippines'
    - name: 'Emma T.'
      title: 'Compact Plunge owner, Australia'
      content: 'I had never owned a pool before. The Compact Plunge is so easy to set up that I felt confident on my first try. Now I soak every evening after work. The learning curve is basically zero — and the pool looks amazing on the deck.'
      image: 'https://assets.olagoon.com/images/olagoon/products/compact-plunge.webp'
      location: 'Gold Coast, Australia'

