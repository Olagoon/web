faqs_pool:
  title: 'pools FAQs'
  subtitle: 'Common questions about our drop-stitch pool.'
  columns: 2
  items:
    - title: 'What pool sizes does OLagoon offer?'
      description: 'We offer three pool sizes — Compact Plunge (2 m × 1.5 m), Family Oasis (3 m × 2 m), and Grand Lagoon (5 m × 2.5 m) — all with 20 cm drop-stitch walls. Each model pairs with matched filtration and accessories.'
    - title: 'What is the difference between an inflatable pool and a rigid pool?'
      description: 'An inflatable pool uses drop-stitch construction with thousands of internal threads allowing high air pressure, while a rigid pool is built from steel, resin, or concrete. Inflatable pools offer portability, easy storage, and lower cost without sacrificing structural rigidity.'
    - title: 'How much water do OLagoon pools hold?'
      description: 'Capacity depends on the model and fill level — from roughly 1,500 L for the Compact Plunge to over 8,000 L for the Grand Lagoon. Each product page lists the recommended fill level for your specific model.'
    - title: 'Are OLagoon pools CE certified?'
      description: 'Yes. All pool models are CE certified under applicable European standards for recreational use.'
    - title: 'What is the warranty on OLagoon pools?'
      description: 'All OLagoon pools come with a standard 2-year warranty against manufacturing defects, covering seam failure, valve defects, and material delamination under normal use.'
    - title: 'How long does it take to set up a pool?'
      description: 'Plan on under 30 minutes from box to filling: unpack, inflate the 20 cm walls with the included pump, connect the filter, and start filling. No tools or professional installation required.'

faqs_materials:
  title: 'pool Material & Care FAQs'
  subtitle: 'Common questions about our inflatable pools materials, care, and storage.'
  columns: 2
  items:
    - title: 'What materials are used in OLagoon pools?'
      description: 'We use marine-grade high-tensile PVC with UV-stabilized, abrasion-resistant drop-stitch construction, compliant with EU REACH and RoHS regulations.'
    - title: 'How long do inflatable pools last?'
      description: 'With proper care, a quality drop-stitch pool lasts 5–10 years. Regular cleaning, covered storage, and proper winterization significantly extend service life.'
    - title: 'What maintenance is required for an inflatable pool?'
      description: 'Basic maintenance includes running the filter pump daily, testing and balancing water chemistry weekly, rinsing the walls at season end, and using the thermal cover to keep debris out and heat in.'
    - title: 'Can I use salt-water sanitation in an OLagoon pool?'
      description: 'Yes. Our PVC materials tolerate salt-water sanitation systems. We recommend rinsing the walls thoroughly with fresh water before off-season storage.'
    - title: 'How do I store an inflatable pool for winter?'
      description: 'Drain, clean, and dry the pool completely before storage. Fold loosely (avoid tight creases), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.'
    - title: 'What accessories work with OLagoon pools?'
      description: 'Matched accessories include the sand-filter pump ($249), thermal cover ($129), ground mat ($89), and entry steps ($199) — all sized to your specific model.'

