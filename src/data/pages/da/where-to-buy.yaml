meta:
  title: Hvor køber du oppustelige paddleboards fra OLagoon | OLagoon
  description: Find ud af, hvordan du køber et oppusteligt paddleboard fra OLagoon — via en officiel distributør i dit land eller direkte fra OLagoon-teamet.
hero:
  tagline: Hvor du køber
  title: Kom ud på vandet med din OLagoon SUP
  subtitle: OLagoon-bræt når padlere i over 50 lande. Find den nemmeste måde at få dit eget på — via en officiel forhandler i nærheden eller direkte fra OLagoon-teamet.
channels:
  items:
    - title: Officielle landdistributører
      description: OLagoon samarbejder med eksklusive distributører i mange lande. Fortæl os, hvor du padler, så forbinder vi dig med din lokale forhandler, priser og tilgængelighed.
      cta: Find din lokale forhandler
      href: /contact/?subject=Where to Buy
    - title: Bestil direkte fra OLagoon
      description: Endnu ingen distributør i dit land? OLagoon-teamet kan arrangere direkte bestillinger og forsendelse, så du kan komme ud på vandet, uanset hvor du bor.
      cta: Spørg om tilgængelighed
      href: /contact/?subject=Where to Buy
form_intro:
  title: Spørg om tilgængelighed
  subtitle: Send os en besked med dit land og det bræt, du er interesseret i. Vores team svarer inden for én hverdag med din nærmeste forhandler eller muligheder for direkte bestilling.
business_note:
  text: Køber du for en klub, et resort eller en butik? Udforsk vores forretnings- og partnerprogrammer.
  cta: Til forretningspartnere
  href: /solutions/
