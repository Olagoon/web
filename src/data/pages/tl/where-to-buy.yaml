meta:
  title: Saan Bumili ng OLagoon Inflatable Paddle Board | OLagoon
  description: Alamin kung paano bumili ng OLagoon inflatable paddle board — sa pamamagitan ng opisyal na distributor sa iyong bansa o direkta mula sa OLagoon team.
hero:
  tagline: Saan Bumili
  title: Ilabas ang OLagoon SUP Mo sa Tubig
  subtitle: Umaabot ang mga board ng OLagoon sa mga paddler sa mahigit 50 bansa. Hanapin ang pinakamadaling paraan para makuha ang sarili mo — sa pamamagitan ng opisyal na distributor malapit sa iyo o direkta mula sa OLagoon team.
channels:
  items:
    - title: Opisyal na Distributor bawat Bansa
      description: Nagtutulungan ang OLagoon sa mga eksklusibong distributor sa maraming bansa. Sabihin mo sa amin kung saan ka nagpapaddle at ikokonekta namin kita sa lokal na dealer mo, presyo, at availability.
      cta: Hanapin ang Lokal na Dealer Mo
      href: /contact/?subject=Where to Buy
    - title: Umorder Direkta mula sa OLagoon
      description: Wala pang distributor sa bansa mo? Kaya ayusin ng OLagoon team ang mga diretsong order at shipping para makagawa ka sa tubig saan man ikaw nakatira.
      cta: Itanong ang Availability
      href: /contact/?subject=Where to Buy
form_intro:
  title: Itanong ang Availability
  subtitle: Magpadala sa amin ng mensahe na may kasamang bansa mo at ang board na interesado ka. Sasagot ang aming team sa loob ng isang araw ng trabaho kasama ang pinakamalapit na dealer o mga opsyon sa diretsong order.
business_note:
  text: Bumibili para sa club, resort, o tindahan? Tuklasin ang aming mga business at partnership program.
  cta: Para sa Business Partners
  href: /solutions/
