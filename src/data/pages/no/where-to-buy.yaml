meta:
  title: Hvor kjøper du oppblåsbare paddleboards fra OLagoon | OLagoon
  description: Finn ut hvordan du kjøper et oppustelig paddleboard fra OLagoon — via en offisiell distributør i ditt land eller direkte fra OLagoon-teamet.
hero:
  tagline: Hvor du kjøper
  title: Kom deg på vannet med din OLagoon SUP
  subtitle: OLagoon-brett når padlere i over 50 land. Finn den enkleste måten å få ditt på — via en offisiell forhandler nær deg eller direkte fra OLagoon-teamet.
channels:
  items:
    - title: Offisielle landdistributører
      description: OLagoon samarbeider med eksklusive distributører i mange land. Fortell oss hvor du padler, så kobler vi deg til din lokale forhandler, priser og tilgjengelighet.
      cta: Finn din lokale forhandler
      href: /contact/?subject=Where to Buy
    - title: Bestill direkte fra OLagoon
      description: Ingen distributør i ditt land ennå? OLagoon-teamet kan ordne direktebestillinger og frakt slik at du kan komme deg på vannet, uansett hvor du bor.
      cta: Spør om tilgjengelighet
      href: /contact/?subject=Where to Buy
form_intro:
  title: Spør om tilgjengelighet
  subtitle: Send oss en melding med landet ditt og brettet du er interessert i. Teamet vårt svarer innen én virkedag med din nærmeste forhandler eller alternativer for direktebestilling.
business_note:
  text: Kjøper du for en klubb, et resort eller en butikk? Utforsk våre forretnings- og partnerprogrammer.
  cta: For forretningspartnere
  href: /solutions/
