meta:
  title: 'Private Label Pool Manufacturing & Custom Brand Launch | {SITE}'
  description: 'Private label pool manufacturer for new inflatable pool brands. Launch your own pool brand with OLagoon — full OEM/ODM service including design, prototyping, custom branding, production, and global logistics.'

hero:
  tagline: Build Your Own Brand
  title: 'Launch Your Own<br />Pool Brand'
  subtitle: "You have the vision. We have the factory, the expertise, and the supply chain. Private label pool manufacturing and custom pool brand development — together, we'll build a brand that stands out."
  image:
    src: https://assets.olagoon.com/images/olagoon/products/grand-lagoon.webp
    alt: Custom branded OLagoon pools ready for a new brand launch

process:
  title: Your Brand Journey
  subtitle: 'From idea to market in 5 phases.'
  steps:
    - phase: 'Phase 1'
      title: 'Idea'
      period: 'Week 1-2'
      items:
        - 'Market research & competitor analysis'
        - 'Target customer definition'
        - 'Brand positioning workshop'
        - 'Product line strategy'
    - phase: 'Phase 2'
      title: 'Design'
      period: 'Week 3-6'
      items:
        - 'Pool shape & graphic design'
        - 'Color matching & material selection'
        - 'Accessory specification'
        - 'Packaging & label design'
    - phase: 'Phase 3'
      title: 'Prototype'
      period: 'Week 7-10'
      items:
        - 'Sample production'
        - 'Quality testing (pressure, seams, UV)'
        - 'Design adjustments'
        - 'Final approval'
    - phase: 'Phase 4'
      title: 'Production'
      period: 'Week 11-14'
      items:
        - 'Bulk manufacturing'
        - 'QC inspection (per unit)'
        - 'Sea freight / air freight'
        - 'Customs clearance documents'
    - phase: 'Phase 5'
      title: 'Launch'
      period: 'Week 15-16'
      items:
        - 'Product photography'
        - 'Website product feed'
        - 'Marketing materials'
        - 'Launch support'

packages:
  title: Startup Packages
  subtitle: 'Packages designed for every stage of brand growth.'
  items:
    - name: Starter Brand
      tagline: 'From 100 units · 2 pool models'
      features:
        - 'Basic logo printing'
        - 'Standard packaging'
        - 'Email support'
    - name: Growing Brand
      tagline: '300-1,000 units · 3-5 pool models'
      features:
        - 'Custom color + logo'
        - 'Custom packaging'
        - 'Product photos'
        - 'Dedicated manager'
    - name: Established Brand
      tagline: '1,000+ units · Full product line'
      features:
        - 'Full customization'
        - 'Premium packaging'
        - 'Marketing collateral'
        - 'Priority production'

features:
  title: Why Brands Choose OLagoon
  subtitle: '10+ years of OEM experience, full certification, and flexible startup MOQs.'
  items:
    - title: '10+ Years OEM Experience'
      description: 'Pools delivered to brands in 50+ countries since 2012.'
      icon: 'tabler:clock'
    - title: 'Full Certification'
      description: 'CE / ISO / UKCA / BSCI / REACH — all certified.'
      icon: 'tabler:certificate'
    - title: 'Tiered Lead Times'
      description: 'Samples in 15–20 days; production in 8–16 weeks by volume.'
      icon: 'tabler:truck-delivery'
    - title: 'Low MOQ'
      description: 'From 100 units — flexible startup volumes.'
      icon: 'tabler:package'
    - title: 'In-House Design'
      description: 'Full design support from concept to final artwork.'
      icon: 'tabler:palette'
    - title: 'Global Logistics'
      description: 'Sea freight, air freight, and customs clearance support.'
      icon: 'tabler:world'

cta:
  title: 'Ready to launch your brand?'
  subtitle: 'Start your brand journey or download our OEM guide.'
  actions:
    - text: 'Start Your Brand Journey'
      href: '/contact/?package=oem'
      variant: 'primary'
    - text: 'Download OEM Guide'
      href: '/resources/download-catalog/'
      variant: 'secondary'
