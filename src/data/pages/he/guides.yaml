size_guide:
  tagline: Size & Specs
  title: Find the Right Size for Your Needs
  desc: Compare pool dimensions, water capacity, and recommended uses. Whether you need a compact plunge, a family pool, or a grand swim lounge — our size guide helps you choose the right fit.
  link_label: 'Full size guide with product specs →'
  link: /size-guide/
  cards:
    - title: pools
      desc: Choose size based on your household and intended use. Larger pools (3 m+) fit the whole family. Compact models (2 m) fit patios and small gardens.
    - title: Touring pools
      desc: Grand Lagoon (5 m × 2.5 m) for real lap swimming and full-family use. Always check your available space and water capacity.
    - title: All-Around pools
      desc: Choose size by household and use. Family Oasis (3 m × 2 m) balances play space and backyard footprint. Versatile for recreation and fitness.
