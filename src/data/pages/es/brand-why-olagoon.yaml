features3_reasons:
  tagline: Por qué elegir olagoon
  title: Siete Razones para Asociarse
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Fabricación Real, No Comercio
      description: Poseemos una fábrica de 12.000 m². Trabaje directamente con los diseñadores – sin intermediarios.
      icon: tabler:building-factory
    - title: 2. Enfoque dirigido por la ingeniería
      description: Nuestro diseño comienza con el caso de uso, no con la categoría.
      icon: tabler:engine
    - title: 3. Calidad Certificada
      description: CE, ISO, BSCI, REACH, USCG. Cada producto cumple estándares internacionales.
      icon: tabler:certificate
    - title: 4. Co-branding flexible
      description: Colores, diseño, marca, empaque – personalizamos según sus especificaciones.
      icon: tabler:adjustments
    - title: 5. Logística Global
      description: Almacén en California, envío directo desde Qingdao, carga aérea para urgente.
      icon: tabler:truck-delivery
    - title: 6. Soporte de por vida
      description: Apoyamos tablas que construimos hace 20 años. Piezas originales, asesoramiento.
      icon: tabler:lifebuoy
    - title: 7. Especificaciones Honestas
      description: Capacidades reales, dimensiones reales, peso real. Sin inflación de marketing.
      icon: tabler:ruler-measure
