meta:
  title: 'B2B Resources & Downloads | {SITE}'
  description: 'Download OEM manufacturing guides, product catalogs, quality reports, and planning tools for inflatable pool business partners.'

hero:
  tagline: Resource Center
  title: 'Tools & Resources<br />For Pool Business Partners'
  subtitle: 'Download OEM guides, product catalogs, and quality reports for your inflatable pool program.'

resources:
  - title: '2026 OEM/ODM Product Catalog'
    description: 'Complete drop-stitch pool lineup with specifications, pricing tiers, MOQ, and customization options for B2B partners.'
    icon: 'tabler:file-text'
    type: 'catalog'
    link: '/media/'
    cta: 'Download Catalog'
  - title: 'Drop-Stitch Pool Knowledge Base'
    description: 'Structured guides on drop-stitch technology, water safety, materials engineering, and pool care for you and your customers.'
    icon: 'tabler:book'
    type: 'guide'
    link: '/knowledge/'
    cta: 'Open Knowledge Base'
  - title: 'Pool Program Planning Tools'
    description: 'Estimate your resort, community, or retail pool program investment, projected revenue, and payback period.'
    icon: 'tabler:calculator'
    type: 'tool'
    link: '#roi-calculator'
    cta: 'Plan Your Program'
  - title: 'Quality & Certification Report'
    description: 'CE certification documents, ISO 9001 quality management, UV aging test results, and pressure hold test data.'
    icon: 'tabler:certificate'
    type: 'report'
    link: '/evidence/'
    cta: 'View Reports'
  - title: 'Factory Capability Brochure'
    description: 'Virtual tour of our 12,000 m² manufacturing facility with production line details and quality control processes.'
    icon: 'tabler:building-factory'
    type: 'brochure'
    link: '/factory/'
    cta: 'Tour Factory'
  - title: 'Dealer & Retailer Program Guide'
    description: 'Protected territories, wholesale margins, training, and marketing support for OLagoon dealers across the USA.'
    icon: 'tabler:chart-bar'
    type: 'guide'
    link: '/news/seeking-dealers-for-olagoon/'
    cta: 'Read Guide'

cta:
  title: 'Need Custom Support?'
  subtitle: 'Contact our B2B team for personalized guidance on your project.'
  button: 'Contact Sales Team'
  link: '/contact/?source=resources'
