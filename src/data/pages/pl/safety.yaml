hero:
  tagline: Safety
  title: Safety Standards & Certification
  subtitle: Every OLagoon product undergoes rigorous testing and meets international safety standards for family and professional use.

certifications:
  - title: CE Certification
    description: All OLagoon pools comply with CE marking requirements under applicable European regulations for domestic inflatable swimming pools, including material safety and structural integrity testing.
  - title: EN 71-8 Testing
    description: Inflatable pools intended for domestic use are tested against EN 71-8 requirements for inflatable activity equipment — material strength, entrapment hazards, and structural integrity under load.
  - title: REACH & RoHS Compliance
    description: All pool materials — PVC fabrics, adhesives, and valve components — comply with EU REACH and RoHS regulations. No restricted substances, no compromises.

