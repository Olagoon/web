meta:
  title: Πού να αγοράσετε φουσκωτές σανίδες paddle OLagoon | OLagoon
  description: Μάθετε πώς να αγοράσετε μια φουσκωτή σανίδα paddle OLagoon — μέσω επίσημου διανομέα στη χώρα σας ή απευθείας από την ομάδα OLagoon.
hero:
  tagline: Πού να αγοράσετε
  title: Βγείτε στο νερό με το SUP OLagoon
  subtitle: Οι σανίδες OLagoon φτάνουν σε κωπηλάτες σε περισσότερες από 50 χώρες. Βρείτε τον πιο απλό τρόπο να αποκτήσετε τη δική σας — μέσω επίσημου διανομέα κοντά σας ή απευθείας από την ομάδα OLagoon.
channels:
  items:
    - title: Επίσημοι διανομείς ανά χώρα
      description: Η OLagoon συνεργάζεται με αποκλειστικούς διανομείς σε πολλές χώρες. Πείτε μας πού κωπηλατείτε και θα σας συνδέσουμε με τον τοπικό σας αντιπρόσωπο, τις τιμές και τη διαθεσιμότητα.
      cta: Βρείτε τον τοπικό σας αντιπρόσωπο
      href: /contact/?subject=Where to Buy
    - title: Απευθείας παραγγελία από την OLagoon
      description: Δεν υπάρχει ακόμη διανομέας στη χώρα σας; Η ομάδα OLagoon μπορεί να κανονίσει απευθείας παραγγελίες και αποστολές ώστε να απολαύσετε το νερό όπου κι αν ζείτε.
      cta: Ρωτήστε για διαθεσιμότητα
      href: /contact/?subject=Where to Buy
form_intro:
  title: Ρωτήστε για διαθεσιμότητα
  subtitle: Στείλτε μας μήνυμα με τη χώρα σας και τη σανίδα που σας ενδιαφέρει. Η ομάδα μας θα απαντήσει εντός μίας εργάσιμης ημέρας με τον κοντινότερο αντιπρόσωπο ή επιλογές απευθείας παραγγελίας.
business_note:
  text: Αγοράζετε για σύλλογο, θέρετρο ή κατάστημα; Εξερευνήστε τα εμπορικά και συνεργατικά μας προγράμματα.
  cta: Για εμπορικούς συνεργάτες
  href: /solutions/
