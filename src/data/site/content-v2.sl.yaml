- slug: pool-winter-storage
  category: guide
  type: tutorial
  title: Pool Winter Storage (Pack Down So It Lasts a Decade)
  description: The end-of-season routine that protects your drop-stitch pool, covering drain, clean, dry, deflate, and fold for indoor storage. Do these steps and the same pool greets you next summer.
  definition: 'Winter storage is the end-of-season process of draining, cleaning, fully drying, deflating, and folding a drop-stitch pool into its storage bag so the fabric and seams survive frost, rodents, and months of idling.'
  tldr: Drain, clean, and completely dry the pool before folding, because trapped moisture is the leading cause of mold and seam damage in storage. Store the folded pool indoors, dry and off the floor, and bring the pump and accessories inside too.
  problem: Too many owners leave their pool standing through the first frost, and the damage is invisible until spring. Freezing water splits seams from the inside, snow load deforms the walls, and rodents discover that soft PVC is an excellent nesting material. A pool that would have lasted many seasons is instead unwrapped in April with a musty smell, black mold spots, and a slow leak no one can find.
  explanation: 'Fabric care drives everything in pack-down. PVC tolerates swimming-season sun and pressure well, but three off-season enemies destroy it: moisture (mold and seam adhesive breakdown), freezing (ice expansion inside valves and creases), and gnawing pests. That is why the pool must be bone-dry before folding, ideally dried over 24-48 hours in the sun, and why it should be folded loosely rather than crushed into a tight ball. Storage location matters as much as technique, because a dry indoor closet at room temperature beats a freezing, damp garage every time. The accessories need the same discipline, since a sand filter pump full of damp sand will smell terrible by spring.'
  solution: 'About two weeks before your last swim, stop adding chemicals and let levels settle. At pack-down: drain the pool using the filter pump drain mode, scrub the walls and floor with mild soap and water, and rinse thoroughly. Dry the pool completely for 24-48 hours in sunlight, deflating it partially to expose the creases. Deflate fully, fold loosely along the factory creases, and pack it into the storage bag with the ground mat as a clean folding layer. Store the pool, pump, and cover indoors in a dry, rodent-free space.'
  recommendation: The $89 Protective Ground Mat doubles as a clean folding and packing layer at season end, and the $129 Thermal Pool Cover extends your swimming season on both ends before pack-down. A careful two-hour pack-down is the cheapest protection for a $1,299 pool.
  faq:
    - q: Can I leave my pool outside over winter?
      a: No. Freezing water, snow load, and UV exposure will age the fabric and seams far faster than a summer of use. Always drain, dry, and store the pool indoors.
    - q: Is a shed or garage good enough for storage?
      a: Only if it stays dry, stays above freezing, and is free of rodents. A heated closet or indoor room is ideal, while a damp garage will breed mold inside the folds.
    - q: How dry does the pool really need to be?
      a: 'Bone dry: 24-48 hours of sunlight, with the pool partially deflated so hidden creases dry out. Trapped moisture is the number one cause of mold and seam damage during storage.'
    - q: What do I do with the sand filter pump?
      a: Run a final backwash and rinse, drain all water, and let the pump dry completely before storing it indoors. Replace the sand only every five seasons or so.
    - q: When should I pack the pool down?
      a: After your last swim of the season, ideally on a warm, dry autumn day so the pool can sun-dry fully. Packing down on a dry day saves you a full day of indoor drying later.
