- slug: pool-water-care
  category: guide
  type: tutorial
  title: Pool Water Care Made Simple (Clear Water All Season)
  description: Stop draining and refilling thousands of liters every week. Circulation, sand filtration, and a simple twice-weekly testing routine keep drop-stitch pool water clear, safe, and swim-ready.
  definition: 'Pool water care combines circulation, sand filtration, sanitizing, and pH balancing to keep water clear and safe for swimming without weekly draining.'
  tldr: Run the sand-filter pump every day, test and balance pH and sanitizer twice a week, and shock the pool after heavy use. Backwash the filter weekly and you will not need to drain the pool all summer.
  problem: Standing pool water turns cloudy and then green within days, because sunlight and organic debris feed algae faster than most owners can skim. Many families respond by dumping thousands of liters and refilling, which wastes water, money, and an entire weekend. Water chemistry sounds intimidating, so people avoid it until the pool is already green and slimy.
  explanation: 'Clear water rests on three pillars: circulation, filtration, and sanitation. Circulation moves water through the system so no zone stagnates; the sand filter physically traps particles down to 20-40 microns, and its 6-way valve makes backwashing a two-minute job with no replacement cartridges to buy. Sanitation controls algae and bacteria, and it only works when pH sits in the 7.2-7.6 band, because outside that range chlorine loses most of its power. A thermal cover reduces debris and evaporation, which cuts chemical demand dramatically between swims.'
  solution: Run the filter pump long enough to turn over the full volume at least once daily. Test pH and free chlorine twice a week with test strips and adjust to keep pH between 7.2 and 7.6. Backwash the sand filter about once a week, or when the pressure gauge reads 20 percent above its clean baseline. Shock the pool after pool parties or heavy rain, and keep the thermal cover on between swims.
  recommendation: The $249 OLagoon Sand Filter Pump System is the backbone of the routine, with sand that lasts about five seasons. Add the $129 Thermal Pool Cover to keep leaves out and stop overnight heat and chemical loss.
  faq:
    - q: How long should I run the filter each day?
      a: Long enough to circulate the entire pool volume at least once, typically six to twelve hours in high summer. The 2,400 L/h flow rate of the OLagoon system turns over a family pool in a few hours.
    - q: How often do I backwash the sand filter?
      a: About once a week under normal use, or whenever the pressure gauge reads 20 percent above the clean baseline. The 6-way valve makes it a two-minute job.
    - q: Can I use regular chlorine in an inflatable pool?
      a: Yes. Use standard pool chlorine and keep free chlorine between 1 and 3 ppm with pH between 7.2 and 7.6. The PVC liner is engineered for normal pool chemistry.
    - q: How often should I drain the pool completely?
      a: Once per season, at pack-down time before winter storage. With daily filtration and balanced chemistry, there is no need to drain mid-season.
    - q: Why did my water turn cloudy overnight?
      a: 'Usually a filtration or chemistry problem: the filter needs backwashing, chlorine has dropped, or pH has drifted out of range. Test first, shock if needed, and run the filter continuously until it clears.'
