- slug: pool-setup-guide
  category: problem
  type: tutorial
  title: Pool Setup Guide (From Box to First Swim in One Afternoon)
  description: A step-by-step guide to setting up a drop-stitch pool, covering site check, ground protection, inflation, filtration hook-up, and filling. Two hours from storage bag to swim-ready water.
  definition: 'Drop-stitch pool setup is the sequence of site selection, base protection, inflation, filtration connection, and filling that takes an OLagoon pool from its storage bag to swim-ready in about two hours.'
  tldr: Choose firm, level ground and remove every sharp object, lay the ground mat, inflate to 10-15 PSI with the electric pump, connect the sand-filter pump, and fill. Plan about 15 minutes of inflation and one to three hours of filling with a garden hose.
  problem: Most first-time owners are so excited on delivery day that they rush the base. An uneven site tilts the waterline, strains one side of the seams, and makes the pool look broken within days. Skipping the ground cloth risks a puncture from a stone or root you never noticed, and setting up without checking deck load ratings can be outright dangerous.
  explanation: 'The base is the single most important step, because a filled pool weighs one to three tonnes and presses every flaw in the ground into the floor fabric. Inflation happens in stages: rough-shape the pool at low pressure, check the walls are standing square, then bring it to the rated 10-15 PSI. OLagoon pools include integrated plumbing ports that match the OLagoon sand-filter pump fittings, so circulation can run from the first fill. Filling takes one to three hours depending on hose pressure, and the water should be balanced before the first swim.'
  solution: 'Start by selecting a site: firm, level, clear of stones, roots, and overhanging trees, and within reach of a hose and a grounded outlet. Lay the protective ground mat, unroll the pool on top, and unfold it fully. Inflate with the included electric pump to 10-15 PSI, then connect the sand-filter pump to the plumbing port and position it away from the pool edge. Fill with a garden hose, add your startup chemicals, and let the filter circulate before the first swim.'
  recommendation: Pair every setup with the $89 Protective Ground Mat and the $249 Sand Filter Pump System on day one. If children or older swimmers will use the pool, add the $199 Inflatable Entry Steps so nobody has to climb a 64 cm wall wet.
  faq:
    - q: How long does setup really take?
      a: About 15 minutes to inflate with the electric pump, then one to three hours to fill depending on water pressure. Unrolling, mat placement, and filter connection add another 30 minutes.
    - q: What kind of ground can I set up on?
      a: 'Any firm, level area: lawn, pavers, concrete, or a deck rated for the filled weight. Remove stones, sticks, and sharp objects first, and always use the ground mat on hard or rough ground.'
    - q: Can I set the pool up on a deck or balcony?
      a: Only if the structure is rated for the filled weight. A filled family pool weighs well over a tonne, comparable to a hot tub, so confirm load ratings with a professional first.
    - q: Why does my pool look lopsided while inflating?
      a: Low pressure makes drop-stitch walls look soft and uneven. Bring the pool up to its rated 10-15 PSI and the walls will stand straight and square. If it still leans, the ground underneath is not level.
    - q: When is the water safe to swim in?
      a: Once it is filled, balanced, and circulating through the filter. Test pH and sanitizer levels first, and never let children enter until an adult has confirmed the water is treated.
