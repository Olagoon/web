cases:
  - id: small-backyard
    title: Small Backyard Plunge
    desc: A compact rigid pool for tight spaces.
    scenario: >-
      A couple with a small townhouse yard wants a real swimming pool for
      cooling off and relaxing after work, without permanent construction.
    solution: >-
      The Compact Plunge Pool fits a 2m x 1.5m footprint and sets up on any
      level surface. The Ground Mat protects the base, and the Thermal Pool
      Cover keeps the water warm and clean between swims.
    products:
      - Compact Plunge Pool
      - Ground Mat
      - Thermal Pool Cover
    image: /images/olagoon/products/compact-plunge.webp

  - id: family-fun
    title: Family Backyard Fun
    desc: A full-size pool for the whole family.
    scenario: >-
      A family of four wants a pool the kids can actually swim and play in all
      summer, with clean water and easy entry for little ones.
    solution: >-
      The Family Oasis Pool offers a 3m x 2m swim area with rigid 20cm
      drop-stitch walls. The Sand Filter Pump keeps the water clear, and the
      Entry Steps give children a safe, stable way in and out.
    products:
      - Family Oasis Pool
      - Sand Filter Pump
      - Entry Steps
    image: /images/olagoon/products/family-oasis.webp

  - id: entertaining
    title: Entertaining & Hosting
    desc: A statement lagoon for gatherings.
    scenario: >-
      A homeowner who loves weekend gatherings wants a showpiece pool big
      enough for guests of all ages, plus reliable water care with zero fuss.
    solution: >-
      The Grand Lagoon Pool delivers a 5m x 2.5m swim zone engineered like a
      yacht deck. The Sand Filter Pump and Thermal Pool Cover keep the water
      party-ready, and the Entry Steps complete the resort feel.
    products:
      - Grand Lagoon Pool
      - Sand Filter Pump
      - Entry Steps
      - Thermal Pool Cover
    image: /images/olagoon/products/grand-lagoon.webp
