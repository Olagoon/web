faqs:
  - q: Does OLagoon provide OEM/ODM services for inflatable pools?
    a: >-
      Yes. OLagoon (operated by Olagoon LLC, USA, with manufacturing managed by
      our Qingdao Operation Team) offers full-scale OEM and ODM customization —
      from 3D blueprints and drop-stitch material selection to bulk production
      for global brands. We handle private labeling, custom packaging, and
      compliance documentation for BSCI, CE, and other certifications.
  - q: What certifications does OLagoon hold for inflatable pool manufacturing?
    a: >-
      OLagoon's factory is certified and all pools meet CE standards. We also
      hold BSCI social compliance certification required by major European and
      North American retailers. REACH and RoHS compliance available on request.
  - q: What is the minimum order quantity (MOQ) for OEM inflatable pools?
    a: >-
      Samples and trial orders start at 5-10 units for evaluation. Standard
      production runs start at 50 units. Logo customization: 50 units. Custom
      packaging: 100+ units. Custom molds and deep private-label projects
      require a minimum of 200 units depending on complexity.
  - q: Which materials does OLagoon use for inflatable pool production?
    a: >-
      We use marine-grade laminated PVC (0.9 mm-1.2 mm) with a double-layer
      drop-stitch core. Materials are tested for tensile strength, UV
      resistance, and low-temperature flexibility before production.
  - q: Can OLagoon handle large-volume wholesale orders for international buyers?
    a: >-
      Yes. Our 12,000 m² factory produces over 15,000 units annually with a
      dedicated team of 200+ skilled workers. We ship to 50+ countries and
      manage logistics including FOB Qingdao, CIF major ports, and door-to-door
      delivery through our freight partners.
  - q: What is the lead time for OEM inflatable pool production?
    a: >-
      Samples ship within 15-20 working days from approval. Production runs
      take 12-16 weeks for 50-100 units, 10-14 weeks for 300-1,000 units, and
      8-12 weeks above 1,000 units, from approval to FOB Qingdao. Custom mold
      projects add 15-20 days for tooling. Rush orders available for
      established partners with confirmed material stock.
  - q: Does OLagoon supply military-grade drop-stitch material for pools?
    a: >-
      Yes. Our drop-stitch core uses military-spec PVC fabric with tensile
      strength exceeding 2000 N/5cm. The double-layer lamination process
      achieves air-holding retention at 15 PSI with less than 2% pressure loss
      over 24 hours — exceeding requirements for air-holding integrity.
  - q: How does OLagoon ensure the air-tightness and UV resistance of its pools?
    a: >-
      Every pool undergoes a 24-48 hour pressure-hold test at 1.25x rated PSI
      before shipment. UV resistance is validated via 1000-hour accelerated
      weathering with less than 10% tensile strength degradation. Our PVC
      compound includes UV stabilizers and anti-oxidant additives for
      long-term outdoor durability.
  - q: What is the drop-stitch technology used in OLagoon pools?
    a: >-
      Drop-stitch is a fabric construction where thousands of polyester threads
      connect the top and bottom PVC layers. When inflated to 10-15 PSI, these
      threads pull the panels to a fixed distance, creating rigid, flat walls
      and floors. OLagoon uses fusion-laminated drop-stitch — where threads are
      thermally bonded into the PVC — for superior delamination resistance vs.
      traditional glue-bonded cores.
  - q: How long does it take to set up an OLagoon pool?
    a: >-
      Plan on 30-45 minutes: unbox, lay the Ground Mat, roll out the pool,
      inflate with the included pump to 10-15 PSI, and fill with water. Two
      people make it easiest, and no tools are required.
  - q: How do I keep the water clean?
    a: >-
      The Sand Filter Pump circulates and clarifies the water automatically,
      and the Thermal Pool Cover keeps out debris between swims. With regular
      filtration and a fitted cover, one fill typically stays clean for weeks.
  - q: Can I place the pool on grass, concrete, or a deck?
    a: >-
      Yes — any level, debris-free surface works. Always use the Ground Mat
      underneath to protect the base. Remember that a filled pool is heavy
      (the Grand Lagoon holds about 12,500 liters), so decks and balconies
      must be verified for the load first.
  - q: How do I store the pool for winter?
    a: >-
      Drain, clean, and fully dry the pool, then fold it and store it in the
      included carry bag in a frost-free, dry place. Also drain and store the
      Sand Filter Pump indoors. Properly stored, the pool will be ready for
      next season.
  - q: Are OLagoon pools safe for kids?
    a: >-
      Yes, with constant adult supervision. The rigid 20cm drop-stitch walls
      and stable Entry Steps make getting in and out safe and easy. Never dive,
      and always cover or supervise the pool when children are nearby.
  - q: What warranty do OLagoon pools carry?
    a: >-
      Every OLagoon pool is backed by a 2-year warranty covering manufacturing
      defects — seams, valves, and material integrity. A repair kit is included
      for minor punctures, and replacement parts are available on request.
  - q: Do you offer bundle deals?
    a: >-
      Yes. We offer curated bundles like the Family Fun Pack (Family Oasis
      Pool + Sand Filter Pump + Entry Steps) that save you up to $198 compared
      to buying items separately. Browse all bundles on the products page.
