badge: Proof & Results
heading: Evidence
description: Real case studies, certifications, test data, and deployment photos that demonstrate our drop-stitch inflatable pool manufacturing capability and product quality.

case_studies:
  - id: retail-private-label
    client: European Home & Garden Retailer
    product: Private-Label Drop-Stitch Pool Line
    industry: Retail
    challenge: A major European home and garden retailer needed a private-label inflatable pool line with distinctive sidewall graphics, REACH-compliant PVC, and retail-ready packaging across 4 SKUs.
    solution: Developed custom sidewall print artwork, sourced REACH-compliant drop-stitch PVC, and compressed sampling from 3 rounds to 1 by co-locating the retailer's design team at our Qingdao manufacturing operation.
    result: 55 days from signed PO to FOB. 2,400 units across 4 SKUs covering Compact Plunge and Family Oasis formats. Repeat order placed before the first container arrived.
    image: /images/olagoon/products/family-oasis.webp
    tags: [OEM, Retail, Pool]
    outcome_metrics:
      - label: Lead Time
        value: 55 days
      - label: Units
        value: 2,400
      - label: SKUs
        value: '4'

  - id: resort-pool-fleet
    client: Caribbean Luxury Resort Group
    product: UV-Stabilized Pool Fleet + Filtration
    industry: Hospitality / Tourism
    challenge: A 5-property Caribbean luxury resort group needed a unified fleet of drop-stitch pools with consistent branding, UV-stabilized materials for tropical sun, integrated sand filter pump systems, and a multi-year replacement plan.
    solution: Designed a custom Grand Lagoon and Family Oasis pool fleet package with UV-stabilized PVC, resort-branded sidewall graphics, and matched Sand Filter Pump and Thermal Pool Cover sets. Delivered a phased schedule across 5 properties with staff training and a dedicated spare parts kit per resort.
    result: 180 units delivered across 5 properties. 40% reduction in per-unit cost versus previous pool vendors. Repeat order placed for 2 new properties.
    image: /images/olagoon/hero/pool-lagoon-hero.webp
    tags: [OEM, Hospitality]
    outcome_metrics:
      - label: Units Delivered
        value: 180
      - label: Properties
        value: '5'
      - label: Cost Reduction
        value: 40%
    before_after:
      - label: Annual Pool Replacement Cost
        before: $28,000
        after: $12,000
      - label: Pool Downtime (days/year)
        before: 45
        after: 8
      - label: Guest Satisfaction Score
        before: 3.8/5
        after: 4.6/5

  - id: dtc-ecommerce-pool-brand
    client: US DTC Pool Brand
    product: 3-Model Drop-Stitch Pool Line
    industry: E-commerce / Retail
    challenge: A fast-growing US direct-to-consumer brand needed a complete inflatable pool package (pool, Sand Filter Pump, Thermal Pool Cover, Ground Mat) with premium packaging designed for e-commerce fulfilment direct to consumer doorsteps without transit damage.
    solution: Developed a co-branded 3-model line spanning Compact Plunge, Family Oasis, and Grand Lagoon with proprietary drop-stitch cores rated for higher PSI, and retail-ready double-wall corrugated boxes with insert padding. Integrated QR-code-based authenticity and warranty registration.
    result: 3-model pool line launched in 75 days. 15,000+ units sold in the first 12 months. 4.8/5 average rating on 2,000+ reviews. 0.3% transit damage rate.
    image: /images/olagoon/products/compact-plunge.webp
    tags: [OEM, DTC, E-commerce]
    outcome_metrics:
      - label: Models
        value: '3'
      - label: First Year Units
        value: 15,000+
      - label: Avg Rating
        value: 4.8/5
      - label: Transit Damage
        value: 0.3%

  - id: distributor-ce-certified-range
    client: Australian Pool Distributor
    product: CE-Certified 3-Model Pool Range
    industry: Distribution / Retail
    challenge: An Australian distributor required a CE-certified 3-model drop-stitch pool range with AS 1926.1 safety compliance testing, custom sidewall colours, and pool fencing and safety documentation for the Australian retail market.
    solution: Produced pre-production samples in 4 colour variants, coordinated third-party AS 1926.1 safety compliance testing alongside CE conformity assessment, and built a complete range spanning Compact Plunge, Family Oasis, and Grand Lagoon with Entry Steps and accessory bundles.
    result: CE-certified 3-model pool range launched in the Australian market. Secured a 12-store retail chain contract in the first season.
    image: /images/olagoon/products/grand-lagoon.webp
    tags: [OEM, Pool, Compliance]
    outcome_metrics:
      - label: Models Launched
        value: '3'
      - label: Retail Stores
        value: 12
      - label: Compliance
        value: AS 1926.1

  - id: community-hoa-program
    client: US HOA / Residential Community Program
    product: Communal Pool Installations - Grand Lagoon
    industry: Community / Real Estate
    challenge: A US homeowners association wanted to bring communal swimming to a residential community without permanent in-ground construction, requiring durable shared-use pools, phased deliveries across neighborhoods, and a maintenance program residents could rely on.
    solution: Deployed Grand Lagoon communal pool installations with Sand Filter Pump circulation, Thermal Pool Covers, and Ground Mats at each site. Delivered in phased waves aligned with neighborhood occupancy, with Entry Steps for safe access and a scheduled seasonal maintenance plan.
    result: Multiple communal pool installations completed across the community on a phased delivery schedule. Resident satisfaction with the amenity reached 92% and the program became a model for neighboring HOAs.
    image: /images/olagoon/hero/lakeside-olagoon.webp
    tags: [Community, HOA]
    outcome_metrics:
      - label: Installations
        value: Phased
      - label: Resident Satisfaction
        value: 92%
      - label: Construction Required
        value: None

certifications:
  - name: CE
    body: European Union
    desc: All pools and pump systems carry CE certification in accordance with EU directives for recreational and pool-related equipment.
  - name: ISO 9001
    body: SGS / BSI
    desc: Quality management system certified for the design, manufacturing, and distribution of drop-stitch inflatable pools and accessories.
  - name: BSCI
    body: amfori
    desc: Social compliance certification demonstrating ethical manufacturing, fair labour, and workplace safety across our Qingdao operation.
  - name: REACH
    body: European Chemicals Agency
    desc: All pool materials comply with REACH regulations for chemical safety. Documentation provided with every shipment.
  - name: RoHS
    body: European Union
    desc: Restriction of hazardous substances compliance across all electronic components, including the Sand Filter Pump.

test_results:
  - metric: Units Pressure Tested
    value: 100%
    detail: Every pool, every chamber, every batch
  - metric: Max Pressure Drop
    value: '<5%'
    detail: Over 24-48h pressure-hold at 1.25x rated PSI
  - metric: Major Defect Threshold
    value: AQL 2.5
    detail: Per ISO 2859 sampling standard
  - metric: UV Weathering
    value: 1000 hours
    detail: Xenon-arc UV exposure with no material degradation
  - metric: Test Pressure Margin
    value: 1.25x
    detail: Safety margin on every drop-stitch chamber
  - metric: Safety Defect Tolerance
    value: 0%
    detail: Seams, valves, welds, structural integrity

