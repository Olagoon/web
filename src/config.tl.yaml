# Default SEO metadata
metadata:
  title:
    default: OLagoon — Premium na mga SUP board at kagamitan para sa pakikipagsapalaran sa tubig
    template: '%s — OLagoon'
  description: 'Premium SUPs, paddle boards, and water adventure accessories. Commercial-grade inflatable SUP boards, life vests, pumps, and paddles for every adventure.'
  keywords:
    - OLagoon
    - SUP
    - paddleboard
    - inflatable SUP
    - drop stitch SUP
    - stand up paddle board
    - marine accessories
  author: OLagoon
  robots:
    index: true
    follow: true
  openGraph:
    site_name: OLagoon
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: tl_PH
  twitter:
$1''
$1''
