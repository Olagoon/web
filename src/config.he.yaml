site:
  name: OLagoon
  site: 'https://olagoon.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: 'OLagoon — בריכות שחייה מתנפחות drop-stitch בלחץ גבוה'
    template: '%s — OLagoon'
  description: 'OLagoon מייצרת בריכות שחייה מתנפחות drop-stitch העמידות בלחץ גבוה, שמוקמות תוך דקות ושומרות על קשיחותן לכל אורך העונה. דגמי family ו-plunge עם מערכות סינון חול ואחריות מבנית לשנתיים.'
  keywords:
    - 'OLagoon'
    - 'בריכה מתנפחת'
    - 'בריכת drop-stitch'
    - 'בריכת plunge'
    - 'בריכה משפחתית'
  author: OLagoon
  robots:
    index: true
    follow: true
  openGraph:
    site_name: OLagoon
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: he_IL
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  textDirection: rtl

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

