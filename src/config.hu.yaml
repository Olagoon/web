site:
  name: OLagoon
  site: 'https://olagoon.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: 'OLagoon — Nagy nyomású drop-stitch felfújható medencék'
    template: '%s — OLagoon'
  description: 'OLagoon nagy nyomású drop-stitch felfújható medencéket gyárt, amelyek percek alatt felállíthatók, és egész szezonon át megőrzik merevségüket. Family és plunge modellek homokszűrő rendszerekkel és 2 éves szerkezeti garanciával.'
  keywords:
    - 'OLagoon'
    - 'felfújható medence'
    - 'drop-stitch medence'
    - 'plunge medence'
    - 'családi medence'
  author: OLagoon
  robots:
    index: true
    follow: true
  openGraph:
    site_name: OLagoon
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: hu_HU
  twitter:


    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
