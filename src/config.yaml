site:
  name: OLagoon
  site: 'https://olagoon.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: OLagoon | Premium Inflatable SUP Boards & Water Sports
    template: '%s — OLagoon'
  description: 'Discover OLagoon premium inflatable SUP boards designed for adventure, touring and family paddling — a global water sports brand with exclusive country partnerships, limited co-branded collections, and certified quality.'
  keywords:
    - OLagoon
    - SUP brand
    - water adventure equipment
    - water sports brand
    - SUP boards for beginners
    - marine safety gear
    - drop stitch SUP
    - commercial SUP
    - CE certified watercraft
  author: OLagoon
  robots:
    index: true
    follow: true
  openGraph:
    site_name: OLagoon
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: en_US
  twitter:
$1''
$1''
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

analytics:
  vendors:
    googleAnalytics:
      id: null

