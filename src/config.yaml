  siteName: OLagoon
  siteTagline: 'Drop-Stitch Inflatable Pools — Family & Plunge Models'
  siteDescription: 'OLagoon designs high-pressure drop-stitch inflatable pools that inflate in minutes and hold their shape all season. From compact plunge pools to full family models with sand-filter systems — shipped free across the US with a 2-year structural warranty.'
  organization:
