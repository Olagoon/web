site:
  name: OLagoon
  site: 'https://olagoon.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: 'OLagoon — Drop-stitch bazeni pod visokim tlakom'
    template: '%s — OLagoon'
  description: 'OLagoon izdeluje napihljive drop-stitch bazene, ki prenesejo visok tlak, so postavljeni v nekaj minutah in ohranijo obliko vso sezono. Modela family in plunge s peskovimi filtri in 2-letno garancijo na konstrukcijo.'
  keywords:
    - 'OLagoon'
    - 'napihljiv bazen'
    - 'drop-stitch bazen'
    - 'plunge bazen'
    - 'družinski bazen'
  author: OLagoon
  robots:
    index: true
    follow: true
  openGraph:
    site_name: OLagoon
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: sl_SI
  twitter:


    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%'
