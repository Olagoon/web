site:
  name: OLagoon
  site: 'https://olagoon.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: 'OLagoon — Надувни дроп-стич басейни с високо налягане'
    template: '%s — OLagoon'
  description: 'OLagoon произвежда надувни басейни от дроп-стич (drop-stitch), издържащи високо налягане — монтират се за минути и запазват формата си през целия сезон. Модели family и plunge с пясъчни филтри и 2 години структурна гаранция.'
  keywords:
    - 'OLagoon'
    - 'надувен басейн'
    - 'дроп-стич басейн'
    - 'plunge басейн'
    - 'семеен басейн'
  author: OLagoon
  robots:
    index: true
    follow: true
  openGraph:
    site_name: OLagoon
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: bg_BG
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

