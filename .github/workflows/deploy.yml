name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2ac0f11c5362bbba3a7b34693dd56ba4' }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  deploy:
    name: Build + deploy (R2, Workers, Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not configured (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (5,941 pages)
        run: npm run build

      - name: Ensure Cloudflare resources (D1, Vectorize, R2, Pages project)
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          CT="Content-Type: application/json"

          cf() { # path [json_body] -> response
            if [ $# -ge 2 ]; then curl -s -X POST "${API}$1" -H "${AUTH}" -H "${CT}" --data "$2"
            else curl -s "${API}$1" -H "${AUTH}"; fi
          }
          must_ok() { # label response
            if ! printf '%s' "$2" | jq -e '.success' >/dev/null; then
              echo "::error::$1 failed: $(printf '%s' "$2" | jq -c '.errors // .')"
              exit 1
            fi
          }

          # --- D1 database for contact worker ---
          RESP=$(cf "/d1/database?per_page=100")
          must_ok "D1 list" "$RESP"
          ID=$(printf '%s' "$RESP" | jq -r '.result[]? | select(.name == "olagoon-inquiries") | .uuid' | head -n 1)
          if [ -z "$ID" ]; then
            echo "Creating D1 database olagoon-inquiries..."
            RESP=$(cf "/d1/database" '{"name":"olagoon-inquiries"}')
            must_ok "D1 create" "$RESP"
            ID=$(printf '%s' "$RESP" | jq -r '.result.uuid // empty')
            if [ -z "$ID" ]; then echo "::error::D1 create returned no uuid"; exit 1; fi
          fi
          echo "D1 database olagoon-inquiries: ${ID}"
          sed -i "s/__D1_DATABASE_ID__/${ID}/" workers/contact-worker/wrangler.toml

          # --- Vectorize index for ai worker (bge-base-en-v1.5: 768 dims, cosine) ---
          RESP=$(cf "/vectorize/v2/indexes")
          if printf '%s' "$RESP" | jq -e '.success' >/dev/null 2>&1; then
            VID=$(printf '%s' "$RESP" | jq -r '.result[]? | select(.name == "ai-index") | .name' | head -n 1)
          else
            VID=""
          fi
          if [ -z "$VID" ]; then
            echo "Creating Vectorize index ai-index (768 dims, cosine)..."
            RESP=$(cf "/vectorize/v2/indexes" '{"name":"ai-index","config":{"dimensions":768,"metric":"cosine"}}')
            must_ok "Vectorize create" "$RESP"
          fi

          # --- R2 buckets ---
          for BUCKET in olagoon-assets olagoon-data; do
            RESP=$(cf "/r2/buckets/${BUCKET}")
            if ! printf '%s' "$RESP" | jq -e '.success' >/dev/null 2>&1; then
              echo "Creating R2 bucket ${BUCKET}..."
              RESP=$(cf "/r2/buckets" "{\"name\":\"${BUCKET}\"}")
              must_ok "R2 create ${BUCKET}" "$RESP"
            fi
          done

          # --- workers.dev subdomain (cron triggers require one - API error 10063) ---
          SUB_OK=$(curl -s "${API}/workers/subdomain" -H "${AUTH}" \
            | jq -r 'if .success and .result.enabled then "yes" else "no" end')
          if [ "$SUB_OK" != "yes" ]; then
            for SUB in olagoon olagoon-web; do
              RESP=$(curl -s -X PUT "${API}/workers/subdomain" -H "${AUTH}" -H "${CT}" \
                --data "{\"enabled\":true,\"subdomain\":\"${SUB}\"}")
              if printf '%s' "$RESP" | jq -e '.success' >/dev/null 2>&1; then
                echo "workers.dev subdomain set: ${SUB}.workers.dev"
                break
              fi
              echo "Subdomain '${SUB}' unavailable: $(printf '%s' "$RESP" | jq -c '.errors // .')"
            done
          fi

          # --- Pages project ---
          RESP=$(cf "/pages/projects/olagoon")
          if ! printf '%s' "$RESP" | jq -e '.success' >/dev/null 2>&1; then
            echo "Creating Pages project olagoon (production branch: master)..."
            RESP=$(cf "/pages/projects" '{"name":"olagoon","production_branch":"master"}')
            must_ok "Pages project create" "$RESP"
          fi

      - name: Apply D1 schema (contact worker, idempotent)
        run: npx wrangler d1 execute olagoon-inquiries --remote --file=workers/contact-worker/schema.sql -c workers/contact-worker/wrangler.toml

      - name: Upload static assets to R2 (assets.olagoon.com)
        run: node scripts/fast-upload-r2.mjs

      - name: Deploy Worker contact (olagoon-contact)
        run: |
          set -o pipefail
          npm run deploy:worker-contact 2>&1 | tee /tmp/w.log || {
            echo "::error::contact worker deploy failed: $(tail -n 6 /tmp/w.log | tr '\n' ' ')"
            exit 1
          }

      - name: Deploy Worker ai (olagoon-ai)
        run: |
          set -o pipefail
          npm run deploy:worker-ai 2>&1 | tee /tmp/w.log || {
            echo "::error::ai worker deploy failed: $(tail -n 6 /tmp/w.log | tr '\n' ' ')"
            exit 1
          }

      - name: Deploy Worker admin (olagoon-admin)
        run: |
          set -o pipefail
          npm run deploy:worker-admin 2>&1 | tee /tmp/w.log || {
            echo "::error::admin worker deploy failed: $(tail -n 6 /tmp/w.log | tr '\n' ' ')"
            exit 1
          }

      - name: Deploy Worker automation (olagoon-automation)
        run: |
          set -o pipefail
          npm run deploy:worker-automation 2>&1 | tee /tmp/w.log || {
            echo "::error::automation worker deploy failed: $(tail -n 6 /tmp/w.log | tr '\n' ' ')"
            exit 1
          }

      - name: Set automation cron schedule (0 2 * * *)
        run: |
          RESP=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/olagoon-automation/schedules" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data '[{"cron":"0 2 * * *"}]')
          if ! printf '%s' "$RESP" | jq -e '.success' >/dev/null; then
            echo "::error::cron schedule set failed: $(printf '%s' "$RESP" | jq -c '.errors // .')"
            exit 1
          fi
          echo "Cron schedule set: $(printf '%s' "$RESP" | jq -c '.result')"

      - name: Sync Turnstile secret (contact worker)
        env:
          CONTACT_TURNSTILE_SECRET: ${{ secrets.CONTACT_TURNSTILE_SECRET }}
        run: |
          if [ -n "$CONTACT_TURNSTILE_SECRET" ]; then
            printf '%s' "$CONTACT_TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET -c workers/contact-worker/wrangler.toml
          else
            echo "CONTACT_TURNSTILE_SECRET not set; skipping Turnstile sync."
          fi

      - name: Deploy Pages (olagoon.com)
        run: npx wrangler pages deploy dist/ --project-name olagoon
