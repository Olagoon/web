name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2ac0f11c5362bbba3a7b34693dd56ba4' }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  deploy:
    name: Build + deploy (R2, Workers, Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not configured (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (5,941 pages)
        run: npm run build

      - name: Resolve D1 database id (contact worker)
        run: |
          ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result[]? | select(.name == "olagoon-inquiries") | .uuid' | head -n 1)
          if [ -z "$ID" ]; then
            echo "::error::D1 database olagoon-inquiries not found in account ${CLOUDFLARE_ACCOUNT_ID} (token needs D1:Read)."
            exit 1
          fi
          echo "Resolved D1 database olagoon-inquiries: ${ID}"
          sed -i "s/__D1_DATABASE_ID__/${ID}/" workers/contact-worker/wrangler.toml

      - name: Upload static assets to R2 (assets.olagoon.com)
        run: node scripts/fast-upload-r2.mjs

      - name: Deploy Workers (contact, ai, admin, automation)
        run: npm run deploy:workers

      - name: Sync Turnstile secret (contact worker)
        if: ${{ secrets.CONTACT_TURNSTILE_SECRET != '' }}
        run: |
          printf '%s' "${{ secrets.CONTACT_TURNSTILE_SECRET }}" | npx wrangler secret put TURNSTILE_SECRET -c workers/contact-worker/wrangler.toml

      - name: Deploy Pages (olagoon.com)
        run: npx wrangler pages deploy dist/ --project-name olagoon
