name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2ac0f11c5362bbba3a7b34693dd56ba4' }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  deploy:
    name: Build + deploy (R2, Workers, Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not configured (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (5,941 pages)
        run: npm run build

      - name: Ensure Cloudflare resources (D1, Vectorize, R2, Pages project)
        run: |
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          # --- D1 database for contact worker ---
          ID=$(curl -s "${API}/d1/database?per_page=100" -H "${AUTH}" \
            | jq -r '.result[]? | select(.name == "olagoon-inquiries") | .uuid' | head -n 1)
          if [ -z "$ID" ]; then
            echo "Creating D1 database olagoon-inquiries..."
            curl -s -X POST "${API}/d1/database" -H "${AUTH}" -H "Content-Type: application/json" \
              --data '{"name":"olagoon-inquiries"}' | jq -e '.success'
            ID=$(curl -s "${API}/d1/database?per_page=100" -H "${AUTH}" \
              | jq -r '.result[]? | select(.name == "olagoon-inquiries") | .uuid' | head -n 1)
          fi
          if [ -z "$ID" ]; then echo "::error::Failed to create/resolve D1 database olagoon-inquiries"; exit 1; fi
          echo "D1 database olagoon-inquiries: ${ID}"
          sed -i "s/__D1_DATABASE_ID__/${ID}/" workers/contact-worker/wrangler.toml

          # --- Vectorize index for ai worker (bge-base-en-v1.5: 768 dims, cosine) ---
          VID=$(curl -s "${API}/vectorize/v2/indexes" -H "${AUTH}" \
            | jq -r '.result[]? | select(.name == "ai-index") | .name' | head -n 1)
          if [ -z "$VID" ]; then
            echo "Creating Vectorize index ai-index (768 dims, cosine)..."
            curl -s -X POST "${API}/vectorize/v2/indexes" -H "${AUTH}" -H "Content-Type: application/json" \
              --data '{"name":"ai-index","dimensions":768,"metric":"cosine"}' | jq -e '.success'
          fi

          # --- R2 buckets ---
          for BUCKET in olagoon-assets olagoon-data; do
            CODE=$(curl -s -o /tmp/bucket.json -w "%{http_code}" "${API}/r2/buckets/${BUCKET}" -H "${AUTH}")
            if [ "$CODE" != "200" ]; then
              echo "Creating R2 bucket ${BUCKET}..."
              curl -s -X POST "${API}/r2/buckets" -H "${AUTH}" -H "Content-Type: application/json" \
                --data "{\"name\":\"${BUCKET}\"}" | jq -e '.success'
            fi
          done

          # --- Pages project ---
          CODE=$(curl -s -o /tmp/pages.json -w "%{http_code}" "${API}/pages/projects/olagoon" -H "${AUTH}")
          if [ "$CODE" != "200" ]; then
            echo "Creating Pages project olagoon (production branch: master)..."
            curl -s -X POST "${API}/pages/projects" -H "${AUTH}" -H "Content-Type: application/json" \
              --data '{"name":"olagoon","production_branch":"master"}' | jq -e '.success'
          fi

      - name: Apply D1 schema (contact worker, idempotent)
        run: npx wrangler d1 execute olagoon-inquiries --remote --file=workers/contact-worker/schema.sql -c workers/contact-worker/wrangler.toml

      - name: Upload static assets to R2 (assets.olagoon.com)
        run: node scripts/fast-upload-r2.mjs

      - name: Deploy Workers (contact, ai, admin, automation)
        run: npm run deploy:workers

      - name: Sync Turnstile secret (contact worker)
        env:
          CONTACT_TURNSTILE_SECRET: ${{ secrets.CONTACT_TURNSTILE_SECRET }}
        run: |
          if [ -n "$CONTACT_TURNSTILE_SECRET" ]; then
            printf '%s' "$CONTACT_TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET -c workers/contact-worker/wrangler.toml
          else
            echo "CONTACT_TURNSTILE_SECRET not set; skipping Turnstile sync."
          fi

      - name: Deploy Pages (olagoon.com)
        run: npx wrangler pages deploy dist/ --project-name olagoon
